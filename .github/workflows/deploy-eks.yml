# Shared (reusable) workflow: CI gate → build → push to ECR → create or update on EKS.
#
# Lives once in the organization's ".github" repository and is called by a
# small deploy.yml in each app repo (see workflow-templates/deploy.yml).
# Runs only when a release is published by hand, on whichever branch/tag.
#
# ── Organization level ──
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
#              (lab credentials expire: refresh them with the local script,
#              then "Re-run failed jobs")
#              plus every app setting (POSTGRES_*, MONGO_*, ...). All secrets
#              except AWS_* / EKS_* are copied into the cluster Secret
#              "aether-env", which every container loads with envFrom.
#   Variables: AWS_REGION, EKS_CLUSTER
#
# ── Repository level (optional variables; defaults in parentheses) ──
#   ECR_REPOSITORY (repo name)   K8S_DEPLOYMENT (repo name)
#   CONTAINER_NAME (repo name)   K8S_NAMESPACE  (default)
#   CONTAINER_PORT (none: no Service is created)
#   SERVICE_TYPE   (ClusterIP; use LoadBalancer for public services)

name: Deploy to Amazon EKS (shared)

on:
  workflow_call:

jobs:
  # Only deploy when the CI checks of the released commit passed.
  # No checks at all (repo without CI) is allowed, with a warning.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
    - name: Require successful CI checks
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for i in $(seq 1 30); do
          JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          # Ignore this deploy run's own checks.
          OTHERS="$(echo "$JSON" | jq --arg id "$GITHUB_RUN_ID" \
            '[.check_runs[] | select((.details_url // "") | contains("/runs/" + $id + "/") | not)]')"
          TOTAL="$(echo "$OTHERS" | jq 'length')"
          PENDING="$(echo "$OTHERS" | jq '[.[] | select(.status != "completed")] | length')"
          BAD="$(echo "$OTHERS" | jq -r '[.[] | select(.status == "completed")
            | select(.conclusion as $c | ["success","skipped","neutral"] | index($c) | not)
            | .name] | join(", ")')"
          if [ -n "$BAD" ]; then
            echo "::error::CI did not pass on $GITHUB_SHA: $BAD"
            exit 1
          fi
          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::No CI checks found on $GITHUB_SHA; deploying without a gate."
            exit 0
          fi
          if [ "$PENDING" -eq 0 ]; then
            echo "All $TOTAL CI checks passed on $GITHUB_SHA."
            exit 0
          fi
          echo "$PENDING check(s) still running, waiting..."
          sleep 20
        done
        echo "::error::CI checks did not finish within 10 minutes."
        exit 1

  deploy:
    name: Deploy
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Resolve per-repo names: repo variable if set, otherwise the repo name.
    - name: Resolve settings
      env:
        VAR_ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        VAR_K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
        VAR_CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
        VAR_K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        VAR_CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}
        VAR_SERVICE_TYPE: ${{ vars.SERVICE_TYPE }}
        VAR_AWS_REGION: ${{ vars.AWS_REGION }}
        VAR_EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      run: |
        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        # ECR names must be lowercase.
        ECR_DEFAULT="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
        # Kubernetes names: lowercase letters, digits and "-" only.
        K8S_DEFAULT="$(echo "$ECR_DEFAULT" | sed 's/[^a-z0-9-]/-/g')"
        {
          echo "ECR_REPOSITORY=${VAR_ECR_REPOSITORY:-$ECR_DEFAULT}"
          echo "K8S_DEPLOYMENT=${VAR_K8S_DEPLOYMENT:-$K8S_DEFAULT}"
          echo "CONTAINER_NAME=${VAR_CONTAINER_NAME:-$K8S_DEFAULT}"
          echo "K8S_NAMESPACE=${VAR_K8S_NAMESPACE:-default}"
          echo "CONTAINER_PORT=${VAR_CONTAINER_PORT}"
          echo "SERVICE_TYPE=${VAR_SERVICE_TYPE:-ClusterIP}"
          echo "AWS_REGION=${VAR_AWS_REGION}"
          echo "EKS_CLUSTER=${VAR_EKS_CLUSTER}"
        } >> "$GITHUB_ENV"

    - name: Show settings
      run: |
        echo "ECR repository : $ECR_REPOSITORY"
        echo "EKS cluster    : $EKS_CLUSTER ($AWS_REGION)"
        echo "Deployment     : $K8S_NAMESPACE/$K8S_DEPLOYMENT (container $CONTAINER_NAME, port ${CONTAINER_PORT:-none}, service $SERVICE_TYPE)"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    # First deploy of a new repo: create its ECR repository if it isn't there.
    - name: Ensure ECR repository exists
      run: |
        aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
          || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null
        echo "Using ECR repository $ECR_REPOSITORY"

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build --platform linux/amd64 -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
        docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

    # kubectl and jq are preinstalled on ubuntu-latest runners.
    - name: Configure kubectl for EKS
      run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

    # The target namespace may not exist yet (first deploy).
    - name: Ensure namespace exists
      run: |
        kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        echo "Namespace $K8S_NAMESPACE is ready"

    # Copy every org secret (except AWS_*/EKS_*) into the cluster Secret that
    # all containers load. DB_URL is derived for the Servlet app.
    - name: Sync cluster Secret aether-env
      env:
        ALL_SECRETS: ${{ toJSON(secrets) }}
      run: |
        echo "$ALL_SECRETS" | jq --arg ns "$K8S_NAMESPACE" '
          with_entries(select(.key | test("^(github_token|aws_|eks_)"; "i") | not))
          | . as $s
          | ($s + (if ($s.POSTGRES_HOST and $s.POSTGRES_PORT and $s.POSTGRES_DB_FIRST_YEAR)
                   then {DB_URL: ("jdbc:postgresql://" + $s.POSTGRES_HOST + ":" + $s.POSTGRES_PORT
                                  + "/" + $s.POSTGRES_DB_FIRST_YEAR
                                  + "?sslmode=" + ($s.POSTGRES_SSLMODE // "require"))}
                   else {} end))
          | {apiVersion: "v1", kind: "Secret",
             metadata: {name: "aether-env", namespace: $ns}, type: "Opaque",
             data: with_entries(.value |= @base64)}' \
          | kubectl apply -f - >/dev/null
        echo "Secret aether-env synced in namespace $K8S_NAMESPACE"

    # Create the Deployment (and Service) when missing, otherwise update it.
    # Strategy is always Recreate.
    - name: Create or update Deployment
      env:
        IMAGE: ${{ steps.build-image.outputs.image }}
      run: |
        if kubectl get "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" >/dev/null 2>&1; then
          echo "Deployment exists: updating."
          kubectl patch "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --type=merge \
            -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
          kubectl set image "deployment/$K8S_DEPLOYMENT" "$CONTAINER_NAME=$IMAGE" -n "$K8S_NAMESPACE"
        else
          echo "Deployment not found: creating."
          {
            cat <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${K8S_DEPLOYMENT}
          namespace: ${K8S_NAMESPACE}
          labels:
            app: ${K8S_DEPLOYMENT}
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app: ${K8S_DEPLOYMENT}
          template:
            metadata:
              labels:
                app: ${K8S_DEPLOYMENT}
            spec:
              containers:
              - name: ${CONTAINER_NAME}
                image: ${IMAGE}
                envFrom:
                - secretRef:
                    name: aether-env
        EOF
            if [ -n "$CONTAINER_PORT" ]; then
              cat <<EOF
                ports:
                - containerPort: ${CONTAINER_PORT}
        EOF
            fi
          } | kubectl apply -f -
        fi

        # Service: created once, never overwritten afterwards.
        if [ -n "$CONTAINER_PORT" ] && ! kubectl get "service/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" >/dev/null 2>&1; then
          cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Service
        metadata:
          name: ${K8S_DEPLOYMENT}
          namespace: ${K8S_NAMESPACE}
        spec:
          type: ${SERVICE_TYPE}
          selector:
            app: ${K8S_DEPLOYMENT}
          ports:
          - port: ${CONTAINER_PORT}
            targetPort: ${CONTAINER_PORT}
        EOF
        fi

    - name: Wait for rollout
      run: |
        kubectl rollout status "deployment/$K8S_DEPLOYMENT" \
          -n "$K8S_NAMESPACE" --timeout=600s
